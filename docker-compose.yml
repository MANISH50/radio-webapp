services:
  app:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
    ports:
      # Put a TLS-terminating reverse proxy in front of this in production.
      - "127.0.0.1:8080:8080"
    depends_on:
      - redis
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl"]
    # Not published to the host; only reachable on the compose network.
    read_only: true
    tmpfs:
      - /data
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
